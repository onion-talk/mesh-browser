<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mesh: browser</title>
<style>
:root{
  --bar:#ececf0;--chrome:#f7f7f9;--bg:#fff;--active:#fff;--line:#dcdce2;--ink:#1d1d1f;--muted:#6e6e73;
  --accent:#0a6cff;--accent-ink:#fff;--soft:#e8f1ff;--field:#ececf0;--shadow:0 8px 30px rgba(0,0,0,.14);
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bar:#0a0a0a;--chrome:#141414;--bg:#000;--active:#1f1f1f;--line:#2b2b2b;--ink:#fff;--muted:#a1a1a6;
  --accent:#3d8bff;--accent-ink:#fff;--soft:#0e1c33;--field:#1f1f1f;--shadow:0 8px 30px rgba(0,0,0,.7);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bar:#0a0a0a;--chrome:#141414;--bg:#000;--active:#1f1f1f;--line:#2b2b2b;--ink:#fff;--muted:#a1a1a6;
  --accent:#3d8bff;--accent-ink:#fff;--soft:#0e1c33;--field:#1f1f1f;--shadow:0 8px 30px rgba(0,0,0,.7);color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.titlebar{display:flex;align-items:flex-end;gap:10px;background:var(--bar);padding:8px 10px 0;border-bottom:1px solid var(--line)}
.lights{display:flex;gap:8px;padding:0 4px 14px}
.lights i{width:12px;height:12px;border-radius:50%;display:block}
.lights i{background:var(--line)}
.tabs{display:flex;gap:4px;flex:1;overflow-x:auto;min-width:0;align-items:flex-end}
.tab{display:flex;align-items:center;gap:8px;min-width:110px;max-width:220px;flex:0 1 200px;padding:8px 8px 8px 12px;border-radius:10px 10px 0 0;color:var(--muted);white-space:nowrap;font-size:13px}
.tab[aria-selected="true"]{background:var(--chrome);color:var(--ink);box-shadow:0 -1px 0 var(--line) inset}
.tab .t{flex:1;overflow:hidden;text-overflow:ellipsis;text-align:left}
.tab .x{width:20px;height:20px;border-radius:6px;font-size:15px;line-height:1}
.tab .x:hover,.plus:hover{background:var(--field)}
.plus{width:28px;height:28px;border-radius:8px;margin-bottom:5px;color:var(--muted);font-size:18px}
.nav{display:flex;align-items:center;gap:4px;padding:8px 10px;background:var(--chrome);border-bottom:1px solid var(--line);position:relative}
.ib{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.ib:hover:not(:disabled){background:var(--field);color:var(--ink)}
.ib:disabled{opacity:.35;cursor:default}
.omni{flex:1;display:flex;align-items:center;gap:6px;height:34px;background:var(--field);border-radius:10px;padding:0 4px;min-width:0;border:1px solid transparent}
.omni:focus-within{border-color:var(--accent);background:var(--bg)}
.omni input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none;height:100%;text-align:center}
.omni input:focus{text-align:left}
.badge{position:absolute;right:2px;bottom:2px;min-width:14px;height:14px;border-radius:7px;background:var(--accent);color:var(--accent-ink);font-size:9px;font-weight:700;display:grid;place-items:center;padding:0 3px}
main{flex:1;overflow:auto;position:relative;background:var(--bg)}
.pop{position:absolute;top:100%;margin-top:6px;width:min(320px,calc(100% - 20px));background:var(--chrome);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:20}
.pop h3{margin:0 0 8px;font-size:14px}
.pop p{margin:0 0 10px;color:var(--muted);font-size:13px}
.hop{display:flex;justify-content:space-between;padding:5px 0;font-size:13px}
.hop em{font-style:normal;color:var(--muted)}
.btn{background:var(--accent);color:var(--accent-ink);padding:8px 14px;border-radius:9px;font-weight:500}
.btn.alt{background:var(--field);color:var(--ink)}
.seg{display:inline-flex;background:var(--field);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 14px;border-radius:7px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.2);font-weight:500}
.home{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
.home .in{max-width:560px;width:100%}
.mark{width:76px;height:76px;margin:0 auto 16px;color:var(--accent)}
.mark svg{width:100%;height:100%;stroke-width:1.4}
img.mark{width:104px;height:104px;display:block;border-radius:24px}
.search .btn{display:grid;place-items:center;width:42px;padding:0;border-radius:10px}
h1{font-size:clamp(26px,5vw,38px);margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 22px}
.search{display:flex;gap:8px;background:var(--field);border-radius:14px;padding:6px;margin-bottom:18px}
.search input{flex:1;border:0;background:none;color:var(--ink);font:inherit;font-size:16px;padding:8px 10px;outline:none;min-width:0}
.status{display:inline-flex;align-items:center;gap:8px;background:var(--soft);color:var(--accent);padding:6px 12px;border-radius:999px;font-weight:500;font-size:13px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.set{display:flex;min-height:100%}
.side{width:210px;flex:0 0 auto;background:var(--chrome);border-right:1px solid var(--line);padding:14px 10px}
.side h2{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:0 8px 8px}
.side button{display:flex;width:100%;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;text-align:left}
.side button[aria-current="true"]{background:var(--accent);color:var(--accent-ink)}
.body{flex:1;padding:28px clamp(16px,4vw,48px);max-width:720px}
.body h1{font-size:26px;margin-bottom:18px}
.group{background:var(--chrome);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row small{display:block;color:var(--muted)}
.lvl{display:flex;gap:12px;align-items:flex-start;padding:14px;border-top:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.lvl:first-child{border-top:0}
.lvl[aria-checked="true"]{background:var(--soft)}
.lvl .r{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;margin-top:2px}
.lvl[aria-checked="true"] .r{border:5px solid var(--accent)}
.lvl b{display:block}.lvl span{color:var(--muted);font-size:13px}
.sw{appearance:none;width:42px;height:26px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;flex:0 0 auto;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s}
.sw:checked{background:var(--accent)}.sw:checked::after{transform:translateX(16px)}
.page{padding:clamp(20px,5vw,56px);max-width:640px}
.card{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted);margin-top:16px}
.card code{color:var(--ink)}
@media (max-width:720px){.lights{display:none}.set{flex-direction:column}.side{width:auto;display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}.side h2{display:none}.side button{width:auto;white-space:nowrap}}
.ib,.tab,.seg button,.btn,.lvl,.side button{transition:background .15s,color .15s,transform .1s}
.btn:active,.ib:active{transform:scale(.96)}
.nav{backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px)}
.pop{animation:pin .14s ease-out;transform-origin:top right}
@keyframes pin{from{opacity:0;transform:translateY(-4px) scale(.98)}}
#prog{position:absolute;left:0;bottom:-1px;height:2px;width:0;background:var(--accent);opacity:0}
#prog.run{opacity:1;width:100%;transition:width .6s ease-out}
.fav{width:16px;height:16px;border-radius:5px;background:var(--soft);color:var(--accent);font-size:10px;font-weight:700;display:grid;place-items:center;flex:0 0 auto}
.tab .x{opacity:0}.tab:hover .x,.tab[aria-selected="true"] .x{opacity:1}
.tab:hover:not([aria-selected="true"]){background:var(--field)}
.flow{display:flex;align-items:center;justify-content:center;margin:0 0 22px}
.fn{display:flex;flex-direction:column;align-items:center;font-size:11px;line-height:1.3;color:var(--muted);min-width:64px}
.fn i{width:12px;height:12px;border-radius:50%;background:var(--accent);margin-bottom:6px}
.fn.e i{background:var(--ink)}
.fl{flex:0 1 34px;height:2px;background:var(--accent);opacity:.4;margin-bottom:28px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.acts button{background:var(--chrome);border:1px solid var(--line);border-radius:12px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px}
.acts button:hover{background:var(--soft);color:var(--accent)}
*{scrollbar-width:thin}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="titlebar"><div class="lights" aria-hidden="true"><i></i><i></i><i></i></div><div class="tabs" id="tabs" role="tablist"></div></div>
<div class="nav" id="nav">
  <button class="ib" id="back" aria-label="Back" disabled></button>
  <button class="ib" id="fwd" aria-label="Forward" disabled></button>
  <button class="ib" id="reload" aria-label="Reload"></button>
  <form class="omni" id="omni" onsubmit="return false" autocomplete="off">
    <button type="button" class="ib" id="route" aria-label="Connection details"></button>
    <input id="url" type="text" spellcheck="false" aria-label="Search or enter address" placeholder="Search or enter address">
  </form>
  <button class="ib" id="shield" aria-label="Security level"></button>
  <button class="ib" id="ident" aria-label="New identity" title="New identity"></button>
  <button class="ib" id="gear" aria-label="Settings" title="Settings"></button>
  <div id="pop"></div><div id="prog"></div>
</div>
<main id="view"></main>

<script>
/* ---------- Authenticated backend adapter ---------- */
const MESH_TOKEN = window.__MESH_TOKEN__ || "";
const VNC_PORT = window.__MESH_VNC_PORT__ || 6080;
const tabCircuits = {};
const tabVnc = {};

function randSuffix(){
  const a = new Uint32Array(1);
  crypto.getRandomValues(a);
  return a[0].toString(36).slice(0, 6);
}

async function apiCall(method, path, bodyObj){
  const opts = { method, headers: { "X-Mesh-Token": MESH_TOKEN } };
  if (bodyObj !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(bodyObj);
  }
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error("API " + path + " -> " + r.status);
  return r.json();
}

function buildRouteSummary(net, tabUrl, circuit){
  const isI2p = /\.i2p(\/|$)/i.test(tabUrl || "");
  return [
    {
      role: "Sandbox",
      place: "bwrap + Xvfb",
      id: circuit ? circuit.slice(-8) : "isolated"
    },
    {
      role: "Hybrid Router",
      place: net.router ? "127.0.0.1:4446 (online)" : "127.0.0.1:4446 (offline)",
      id: net.router ? "fail-closed" : "blocked"
    },
    {
      role: isI2p ? "I2P Tunnel" : "Nym Mixnet",
      place: isI2p
        ? (net.i2p ? "i2pd :4444 (online)" : "i2pd :4444 (offline)")
        : (net.nym ? "SOCKS5 :1080 (online)" : "SOCKS5 :1080 (offline)"),
      id: isI2p ? (net.i2p ? "garlic" : "down") : (net.nym ? "sphinx" : "down")
    }
  ];
}

const backend={
  async status(){
    try {
      const st = await apiCall("GET", "/api/status");
      S.net = { i2p: !!st.i2p, nym: !!st.nym, router: !!st.router, websockify: !!st.websockify };
      return st;
    } catch (e) {
      console.error(e);
      return S.net;
    }
  },
  async navigate(tabId,url){
    if (!tabCircuits[tabId]) tabCircuits[tabId] = 'mesh_' + tabId + '_' + randSuffix();
    const res = await apiCall("POST", "/api/navigate", { url, tab: tabCircuits[tabId] });
    if (res && res.vnc_token) {
      tabVnc[tabId] = { token: res.vnc_token, port: res.vnc_port || VNC_PORT, disp: res.disp };
    }
    await this.status();
    return res;
  },
  async newRoute(tabId){
    const oldTab = tabCircuits[tabId] || '';
    const newTab = 'mesh_' + tabId + '_' + randSuffix();
    tabCircuits[tabId] = newTab;
    const t = (typeof S !== 'undefined' && S.tabs) ? S.tabs.find(x => x.id === tabId) : null;
    const u = (t && t.url && !t.url.startsWith('mesh://')) ? t.url : '';
    try {
      const res = await apiCall("POST", "/api/newroute", { old_tab: oldTab, tab: newTab, url: u });
      if (res) {
        S.net = { i2p: !!res.i2p, nym: !!res.nym, router: !!res.router, websockify: !!res.websockify };
        if (res.vnc_token) tabVnc[tabId] = { token: res.vnc_token, port: res.vnc_port || VNC_PORT, disp: res.disp };
        else delete tabVnc[tabId];
      }
    } catch (e) {
      console.error(e);
    }
    return buildRouteSummary(S.net, u, newTab);
  },
  async newIdentity(){
    Object.keys(tabCircuits).forEach(k => delete tabCircuits[k]);
    Object.keys(tabVnc).forEach(k => delete tabVnc[k]);
    await apiCall("POST", "/api/ident", {}).catch(console.error);
    await this.status();
  },
  async closeTab(tabId){
    delete tabVnc[tabId];
    if (tabCircuits[tabId]) {
      const c = tabCircuits[tabId];
      delete tabCircuits[tabId];
      await apiCall("POST", "/api/close", { tab: c }).catch(console.error);
    }
  },
  async setSecurityLevel(level){
    const res = await apiCall("POST", "/api/config", { level }).catch(console.error);
    if (res && res.tabs) this._syncReloadedTabs(res.tabs);
  },
  async setProtection(key,on){
    const res = await apiCall("POST", "/api/config", { pref: key, val: on ? '1' : '0' }).catch(console.error);
    if (res && res.tabs) this._syncReloadedTabs(res.tabs);
  },
  _syncReloadedTabs(reloaded){
    for (const [tid, circuit] of Object.entries(tabCircuits)) {
      if (reloaded[circuit] && reloaded[circuit].vnc_token) {
        tabVnc[tid] = { token: reloaded[circuit].vnc_token, port: VNC_PORT, disp: reloaded[circuit].disp };
      }
    }
  }
};

/* ---------- State ---------- */
const LEVELS=[
  {k:"standard",n:"Standard",d:"Every feature is on. Best compatibility, least protection."},
  {k:"safer",n:"Safer",d:"Turns off riskier features: scripts run only on secure sites, audio and video wait for a click, some fonts and math symbols are limited. A few sites may look off."},
  {k:"safest",n:"Safest",d:"Static pages only. Scripts, most media and many fonts are blocked. Many sites won’t work, but exposure is lowest."}
];
const PREFS=[
  ["trackers","Block trackers","Stops known tracking requests."],
  ["fingerprint","Make my browser look generic","Reports standard values so you blend in."],
  ["isolate","Keep each tab separate","Tabs never share cookies or storage."],
  ["erase","Erase data when I quit","Clears history, cookies and cache."],
  ["route","Send traffic through relays","Turn off to connect directly."]
];
const S={tabs:[],active:null,pop:null,level:"standard",theme:"system",section:"appearance",net:{i2p:false,nym:false,router:false,websockify:false},prefs:{trackers:true,fingerprint:true,isolate:true,erase:true,route:true}};
let n=0;
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P={back:"M15 6l-6 6 6 6",fwd:"M9 6l6 6-6 6",reload:"M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5",
  shield:"M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6z",ident:"M5 19l7-7M13 4l7 7-7 7-7-7z",search:"M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14zM20 20l-4-4",
  gear:"M4 7h9M17 7h3M4 17h3M11 17h9M15 5v4M9 15v4",lock:"M7 11V8a5 5 0 0 1 10 0v3M6 11h12v9H6z",
  node:"M12 4a2 2 0 1 0 0 .01M5 18a2 2 0 1 0 0 .01M19 18a2 2 0 1 0 0 .01M12 6v5M12 11l-6 6M12 11l6 6"};
const ic=k=>`<svg viewBox="0 0 24 24"><path d="${P[k]}"/></svg>`;
const cur=()=>S.tabs.find(t=>t.id===S.active);

async function addTab(url=""){
  const t={id:++n,title:url?"Settings":"New tab",url,route:await backend.newRoute(n)};
  S.tabs.push(t);S.active=t.id;S.pop=null;render();if(!url)$("url").focus();
}
function closeTab(id){
  backend.closeTab(id);
  const i=S.tabs.findIndex(t=>t.id===id);S.tabs.splice(i,1);
  if(!S.tabs.length)return addTab();
  if(S.active===id)S.active=S.tabs[Math.max(0,i-1)].id;render();
}
async function go(raw){
  const q=raw.trim();if(!q)return;const t=cur();
  const isUrl=/^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(q)||/^https?:\/\//.test(q);
  const proto=/\.i2p(\/|$)/i.test(q)?"http://":"https://";t.url=isUrl?(/^https?:\/\//.test(q)?q:proto+q):"search:"+q;
  t.title=isUrl?q.replace(/^https?:\/\//,""):q;
  await backend.navigate(t.id,t.url);
  t.route=buildRouteSummary(S.net,t.url,tabCircuits[t.id]);
  render();progress();
}
function statusBadgeText(){
  if(!S.prefs.route)return "Direct connection (relays disabled)";
  const parts=[];
  parts.push(S.net.router?"Router :4446 online":"Router :4446 offline");
  parts.push(S.net.i2p?"I2P :4444 online":"I2P :4444 offline");
  parts.push(S.net.nym?"Nym :1080 online":"Nym :1080 offline");
  return parts.join(" · ");
}
async function newRoute(){const t=cur();t.route=await backend.newRoute(t.id);render()}
async function newIdentity(){
  await backend.newIdentity();S.tabs=[];S.pop=null;await addTab();
}
function progress(){const p=$("prog");p.classList.remove("run");void p.offsetWidth;p.classList.add("run");setTimeout(()=>p.classList.remove("run"),900)}
function flow(r){return `<div class="flow"><div class="fn e"><i></i>You</div>${r.map(h=>`<div class="fl"></div><div class="fn"><i></i>${h.role}<br>${h.place}</div>`).join("")}<div class="fl"></div><div class="fn e"><i></i>Site</div></div>`}
function netHtml(){const r=cur().route;return `<h1>Network</h1><div class="group">${S.prefs.route?r.map(h=>`<div class="row"><div>${esc(h.role)}<small>${esc(h.place)}</small></div><span style="color:var(--muted)">${esc(h.id)}</span></div>`).join(""):`<div class="row"><div>Relays are off<small>Traffic connects directly.</small></div></div>`}</div><button class="btn" data-act="newroute">New route</button>`}
function setLevel(k){S.level=k;backend.setSecurityLevel(k);render()}
function setTheme(t){
  S.theme=t;
  if(t==="system")document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme",t);
  render();
}

/* ---------- Render ---------- */
function render(){
  const t=cur(),L=LEVELS.find(l=>l.k===S.level);
  $("tabs").innerHTML=S.tabs.map(x=>`<div class="tab" role="tab" aria-selected="${x.id===S.active}" data-id="${x.id}" tabindex="0"><span class="fav">${esc((x.title.trim()[0]||"•").toUpperCase())}</span><span class="t">${esc(x.title)}</span><button class="x" data-x="${x.id}" aria-label="Close tab">&#215;</button></div>`).join("")+`<button class="plus" id="plus" aria-label="New tab">+</button>`;
  $("back").innerHTML=ic("back");$("fwd").innerHTML=ic("fwd");$("reload").innerHTML=ic("reload");
  $("route").innerHTML=ic(S.prefs.route?"node":"lock");$("ident").innerHTML=ic("ident");$("gear").innerHTML=ic("gear");
  $("shield").innerHTML=ic("shield")+`<span class="badge">${L.n[0]}</span>`;
  $("url").value=t.url.startsWith("mesh://")?"":t.url.startsWith("search:")?t.url.slice(7):t.url;
  renderPop();renderView(t);
}
function renderPop(){
  const p=$("pop"),t=cur();
  if(!S.pop){p.innerHTML="";return}
  if(S.pop==="route"){
    p.innerHTML=`<div class="pop" style="left:90px"><h3>Connection</h3>${S.prefs.route?t.route.map(h=>`<div class="hop"><span>${esc(h.role)}</span><em>${esc(h.place)} · ${esc(h.id)}</em></div>`).join("")+`<p style="margin-top:8px">.i2p routes via i2pd (:4444); clearnet routes via Nym Mixnet (:1080). Fails closed if offline.</p><button class="btn alt" data-act="route">New route for this tab</button>`:`<p>Relays are off. This tab connects directly and the site can see your address.</p>`}</div>`;
  }else{

    <form class="search" id="hsearch" onsubmit="return false"><input id="hq" placeholder="Search or enter address" aria-label="Search"><button class="btn" data-act="hsearch" aria-label="Search">${ic("search")}</button></form>
    <span class="status"><i></i>${esc(statusBadgeText())}</span><div class="acts"><button data-act="newroute">${ic("node")}New route</button><button data-act="secure">${ic("shield")}Security level</button><button data-act="ident">${ic("ident")}New identity</button></div></div></div>`;

  const vncInfo = tabVnc[t.id];
  if (!vncInfo || !vncInfo.token) {
    v.innerHTML=`<div class="home"><div class="in"><span class="status"><i></i>Starting isolated sandbox…</span></div></div>`;
    return;
  }
  const vncHost = window.location.hostname === "localhost" ? "localhost" : "127.0.0.1";
  const wsPath = encodeURIComponent("websockify?token=" + vncInfo.token);
  v.innerHTML=`<iframe src="http://${vncHost}:${vncInfo.port}/vnc_lite.html?autoconnect=1&scale=true&resize=scale&reconnect=1&path=${wsPath}" style="position:absolute; inset:0; width:100%; height:100%; border:none; display:block;"></iframe>`;

function renderSettings(v){
  const sec=[["appearance","Appearance"],["security","Security"],["privacy","Privacy"],["network","Network"]];
  let h="";
  if(S.section==="appearance"){
    h=`<h1>Appearance</h1><div class="group"><div class="row"><div>Theme<small>Light, dark, or follow your device.</small></div><div class="seg">${[["light","Light"],["dark","Dark"],["system","Auto"]].map(([k,n])=>`<button data-theme="${k}" aria-pressed="${S.theme===k}">${n}</button>`).join("")}</div></div></div>`;
  }else if(S.section==="security"){
    h=`<h1>Security level</h1><div class="group" role="radiogroup">${LEVELS.map(l=>`<button class="lvl" role="radio" aria-checked="${l.k===S.level}" data-lvl="${l.k}"><span class="r"></span><div><b>${l.n}</b><span>${l.d}</span></div></button>`).join("")}</div>`;
  }else{
    h=S.section==="network"?netHtml():`<h1>Privacy</h1><div class="group">${PREFS.map(([k,a,b])=>`<label class="row"><div>${a}<small>${b}</small></div><input class="sw" type="checkbox" data-pref="${k}" ${S.prefs[k]?"checked":""}></label>`).join("")}</div><div class="group"><div class="row"><div>New identity<small>Closes every tab and starts clean on new routes.</small></div><button class="btn" data-act="ident">Reset</button></div></div>`;
  }
  v.innerHTML=`<div class="set"><nav class="side"><h2>Settings</h2>${sec.map(([k,n])=>`<button data-sec="${k}" aria-current="${S.section===k}">${n}</button>`).join("")}</nav><div class="body">${h}</div></div>`;
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const g=s=>e.target.closest(s);
  let el;
  if(g("#plus"))return addTab();
  if(el=g("[data-x]"))return closeTab(+el.dataset.x);
  if(el=g(".tab")){S.active=+el.dataset.id;S.pop=null;return render()}
  if(g("#route")){S.pop=S.pop==="route"?null:"route";return renderPop()}
  if(g("#shield")){S.pop=S.pop==="shield"?null:"shield";return renderPop()}
  if(g("#gear")){const ex=S.tabs.find(t=>t.url==="mesh://settings");if(ex){S.active=ex.id;S.pop=null;return render()}return addTab("mesh://settings")}
  if(g("#ident")||g("[data-act=ident]"))return newIdentity();
  if(g("#reload")){const t=cur();if(t.url)backend.navigate(t.id,t.url);return}
  if(el=g("[data-lvl]"))return setLevel(el.dataset.lvl);
  if(el=g("[data-theme]"))return setTheme(el.dataset.theme);
  if(el=g("[data-sec]")){S.section=el.dataset.sec;return render()}
  if(el=g("[data-act]")){
    const a=el.dataset.act;
    if(a==="route"||a==="newroute")return newRoute();
    if(a==="secure"){S.section="security";S.pop=null;const ex=S.tabs.find(t=>t.url==="mesh://settings");if(ex){S.active=ex.id;return render()}return addTab("mesh://settings")}
    if(a==="settings"){S.pop=null;const ex=S.tabs.find(t=>t.url==="mesh://settings");if(ex){S.active=ex.id;return render()}return addTab("mesh://settings")}
    if(a==="hsearch")return go($("hq").value);
  }
  if(S.pop&&!g("#pop")){S.pop=null;renderPop()}
});
document.addEventListener("change",e=>{
  const k=e.target.dataset&&e.target.dataset.pref;
  if(k){S.prefs[k]=e.target.checked;backend.setProtection(k,e.target.checked);render()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    if(e.target.id==="url"){go($("url").value);return}
    if(e.target.id==="hq"){go(e.target.value);return}
    if(e.target.classList.contains("tab")){S.active=+e.target.dataset.id;render();return}
  }
  if(e.key==="Escape"&&S.pop){S.pop=null;renderPop()}
  if((e.ctrlKey||e.metaKey)&&e.key==="t"){e.preventDefault();addTab()}
  if((e.ctrlKey||e.metaKey)&&e.key==="w"){e.preventDefault();closeTab(S.active)}
  if((e.ctrlKey||e.metaKey)&&e.key==="l"){e.preventDefault();$("url").select()}
});
(async()=>{await backend.status();await addTab();})();
</script>
